<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DL Assistant — AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f5f6fa; color: #1a1a2e; display: flex; flex-direction: column; height: 100vh; }

    .navbar {
      background: #1a1a2e; padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .navbar .brand { color: #ff6b35; font-weight: 700; font-size: 1.1rem; }
    .navbar a { color: #ccc; text-decoration: none; font-size: 0.85rem; }
    .navbar a:hover { color: #ff6b35; }

    .chat-header {
      background: white; padding: 16px 24px;
      border-bottom: 1px solid #eee; flex-shrink: 0;
      display: flex; align-items: center; gap: 14px;
    }
    .bot-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #f7c59f);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }
    .bot-info .bot-name { font-weight: 700; font-size: 0.95rem; }
    .bot-info .bot-status { font-size: 0.75rem; color: #27ae60; display: flex; align-items: center; gap: 4px; }
    .bot-info .bot-status::before { content: '●'; font-size: 0.6rem; }

    .chat-body {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* MESSAGES */
    .msg { display: flex; gap: 10px; max-width: 85%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .msg.bot .msg-avatar { background: #fff3ec; border: 1.5px solid #ff6b35; }
    .msg.user .msg-avatar { background: #1a1a2e; color: white; font-size: 0.75rem; font-weight: 700; }

    .msg-bubble {
      padding: 12px 16px; border-radius: 16px; font-size: 0.85rem; line-height: 1.6;
    }
    .msg.bot .msg-bubble {
      background: white; border: 1px solid #eee;
      border-bottom-left-radius: 4px; color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .msg.user .msg-bubble {
      background: #ff6b35; color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble ul { padding-left: 18px; margin-top: 6px; }
    .msg-bubble li { margin-bottom: 4px; }
    .msg-bubble strong { color: #ff6b35; }
    .msg.user .msg-bubble strong { color: #fff; }

    /* QUICK REPLIES */
    .quick-replies {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 0 16px 8px; flex-shrink: 0;
    }
    .qr-btn {
      background: white; border: 1.5px solid #ff6b35; color: #ff6b35;
      border-radius: 20px; padding: 6px 14px; font-size: 0.78rem;
      cursor: pointer; transition: all 0.2s; font-family: 'Poppins', sans-serif;
    }
    .qr-btn:hover { background: #ff6b35; color: white; }

    /* TYPING INDICATOR */
    .typing { display: flex; gap: 5px; padding: 10px 14px; }
    .typing span {
      width: 8px; height: 8px; background: #ccc; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

    /* INPUT */
    .chat-input-area {
      background: white; border-top: 1px solid #eee;
      padding: 14px 16px; display: flex; gap: 10px; flex-shrink: 0;
    }
    .chat-input {
      flex: 1; border: 1.5px solid #eee; border-radius: 24px;
      padding: 10px 18px; font-size: 0.88rem; outline: none;
      font-family: 'Poppins', sans-serif; transition: border 0.2s;
    }
    .chat-input:focus { border-color: #ff6b35; }
    .send-btn {
      background: #ff6b35; color: white; border: none;
      border-radius: 50%; width: 42px; height: 42px;
      font-size: 1.1rem; cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .send-btn:hover { background: #e55a28; }
  </style>
</head>
<body>

<nav class="navbar">
  <span class="brand">🚗 DL Journey Tracker</span>
  <a href="dashboard.html">← Back to Dashboard</a>
</nav>

<div class="chat-header">
  <div class="bot-avatar">🤖</div>
  <div class="bot-info">
    <div class="bot-name">DL Assistant</div>
    <div class="bot-status">Online — Ask me anything about your DL process</div>
  </div>
</div>

<div class="chat-body" id="chatBody">
  <!-- Welcome message injected by JS -->
</div>

<div class="quick-replies" id="quickReplies">
  <button class="qr-btn" onclick="sendQuick('What documents do I need?')">📄 Documents needed?</button>
  <button class="qr-btn" onclick="sendQuick('What happens if I fail the test?')">❌ If I fail?</button>
  <button class="qr-btn" onclick="sendQuick('How long is the waiting period?')">⏳ Waiting period?</button>
  <button class="qr-btn" onclick="sendQuick('When does my LL expire?')">📅 LL expiry?</button>
  <button class="qr-btn" onclick="sendQuick('How do I apply for DL?')">🚗 Apply for DL?</button>
  <button class="qr-btn" onclick="sendQuick('What is the DL test like?')">🏎️ DL test info?</button>
</div>

<div class="chat-input-area">
  <input class="chat-input" id="chatInput" type="text" placeholder="Ask anything about DL process..." onkeydown="if(event.key==='Enter')sendMessage()" />
  <button class="send-btn" onclick="sendMessage()">➤</button>
</div>

<script>
const userName = localStorage.getItem('citizen_name') || 'there';
const userStage = localStorage.getItem('dl_stage') || 'unknown';
const llDate = localStorage.getItem('dl_llDate') || null;

// Knowledge base
const KB = [
  {
    keys: ['document', 'doc', 'paper', 'carry', 'need', 'require', 'checklist'],
    answer: `Here are the documents required for your <strong>DL Test</strong>:<ul>
      <li>📄 Original Learner License (LL)</li>
      <li>🪪 Aadhaar Card (original + photocopy)</li>
      <li>📸 2 Passport-size photographs</li>
      <li>📋 Form 9 (Application for DL)</li>
      <li>🏠 Address Proof (if different from LL)</li>
    </ul>Make sure all documents are original. Photocopies alone are not accepted!`
  },
  {
    keys: ['fail', 'failed', 'not clear', 'reject', 'retry', 'attempt'],
    answer: `If you <strong>fail the driving test</strong>:<ul>
      <li>❌ You cannot retake immediately</li>
      <li>⏳ Wait for <strong>7 days</strong> before retry</li>
      <li>📅 Book a new appointment after 7 days</li>
      <li>💰 You may need to pay the test fee again</li>
      <li>📝 No limit on number of attempts</li>
    </ul>Use the 7 days to practice your weak areas. Check the <strong>Retry Page</strong> in your dashboard for a full 7-day practice plan!`
  },
  {
    keys: ['wait', 'waiting', '30 day', 'period', 'minimum'],
    answer: `The <strong>30-day waiting period</strong> is mandatory by RTO rules:<ul>
      <li>📅 It starts from the date your LL was issued</li>
      <li>⏳ You must wait at least 30 days before applying for DL</li>
      <li>🚫 Applying before 30 days = application rejected</li>
      <li>✅ After 30 days, you can book your DL test appointment</li>
    </ul>This time is meant for you to practice driving under a licensed driver's supervision.`
  },
  {
    keys: ['expir', 'expire', 'valid', 'validity', 'how long', '180'],
    answer: `Your <strong>Learner License (LL) validity</strong>:<ul>
      <li>📅 LL is valid for <strong>180 days (6 months)</strong> from issue date</li>
      <li>⚠️ You must apply for DL within 180 days</li>
      <li>❌ If LL expires, you must apply for LL again from scratch</li>
      <li>✅ DL is valid for <strong>20 years</strong> (or until age 50, whichever is earlier)</li>
    </ul>Track your expiry date carefully on your dashboard!`
  },
  {
    keys: ['apply', 'how to', 'procedure', 'process', 'steps', 'get dl'],
    answer: `<strong>Complete DL Application Process:</strong><ul>
      <li>1️⃣ Have a valid Learner License (LL)</li>
      <li>2️⃣ Wait 30 days from LL issue date</li>
      <li>3️⃣ Complete your document checklist</li>
      <li>4️⃣ Book appointment at your nearest RTO</li>
      <li>5️⃣ Appear for driving test at RTO</li>
      <li>6️⃣ Clear the test → DL dispatched by Speed Post</li>
      <li>7️⃣ Receive DL within 7–30 days</li>
    </ul>Your dashboard tracks each of these stages automatically!`
  },
  {
    keys: ['test', 'exam', 'track', 'figure', 'slope', 'h point', 'driving test', 'what happens'],
    answer: `The <strong>Driving Test at RTO</strong> includes:<ul>
      <li>🔄 <strong>Figure-8</strong> — Drive in figure-8 pattern</li>
      <li>🏔️ <strong>H-Point (Slope)</strong> — Stop on slope, restart without rolling back</li>
      <li>📏 <strong>Straight line</strong> — Drive straight without swerving</li>
      <li>🔄 <strong>Turns</strong> — Left/right turns with proper signals</li>
      <li>🅿️ <strong>Parking</strong> — Park in marked area</li>
    </ul>Tips: Drive slow, check mirrors, use indicators, wear helmet/seatbelt from the start!`
  },
  {
    keys: ['fee', 'cost', 'charge', 'money', 'price', 'pay'],
    answer: `<strong>Approximate DL Fee Structure (Maharashtra):</strong><ul>
      <li>📋 LL Application (Form 2): ₹150–200</li>
      <li>🧪 LL Theory Test fee: ₹50</li>
      <li>🚗 DL Application (Form 9): ₹200–300</li>
      <li>🏎️ DL Driving Test fee: ₹300</li>
      <li>📬 Smart Card DL: ₹200</li>
    </ul>Total approximate cost: <strong>₹900–1,050</strong>. Fees may vary by RTO. Check parivahan.gov.in for exact amounts.`
  },
  {
    keys: ['rto', 'office', 'near', 'location', 'where', 'address', 'find'],
    answer: `To find your <strong>nearest RTO</strong>:<ul>
      <li>🗺️ Go to the <strong>RTO Finder</strong> page from your dashboard</li>
      <li>🔍 Search by city or district name</li>
      <li>📍 Click "View on Maps" to get directions</li>
      <li>🌐 Or visit: <strong>parivahan.gov.in</strong> → "Know Your RTO"</li>
    </ul>Carry your documents to the correct RTO where your LL was issued!`
  },
  {
    keys: ['hello', 'hi', 'hey', 'namaste', 'good morning', 'good afternoon'],
    answer: `Hello ${userName}! 👋 I'm your <strong>DL Assistant</strong>. I can help you with:<ul>
      <li>📄 Documents needed</li>
      <li>⏳ Waiting period & timelines</li>
      <li>🏎️ Driving test details</li>
      <li>❌ What to do if you fail</li>
      <li>💰 Fee information</li>
    </ul>What would you like to know?`
  },
  {
    keys: ['thank', 'thanks', 'ok', 'okay', 'great', 'perfect', 'got it'],
    answer: `You're welcome! 😊 Best of luck with your DL journey, ${userName}! 🚗<br>Feel free to ask anything else anytime. You've got this! 🎉`
  }
];

function getAnswer(input) {
  const lower = input.toLowerCase();
  for (const item of KB) {
    if (item.keys.some(k => lower.includes(k))) {
      return item.answer;
    }
  }
  return `I'm not sure about that specific question. Here are some topics I can help with:<ul>
    <li>📄 Documents required for DL test</li>
    <li>⏳ Waiting period rules</li>
    <li>❌ What to do if test fails</li>
    <li>📅 LL expiry & validity</li>
    <li>💰 Fee structure</li>
    <li>🏎️ Driving test details</li>
  </ul>Or visit <strong>parivahan.gov.in</strong> for official information.`;
}

function addMessage(text, type) {
  const chatBody = document.getElementById('chatBody');
  const initials = (localStorage.getItem('citizen_name') || 'U').charAt(0).toUpperCase();

  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${type}`;
  msgDiv.innerHTML = type === 'bot'
    ? `<div class="msg-avatar">🤖</div><div class="msg-bubble">${text}</div>`
    : `<div class="msg-avatar">${initials}</div><div class="msg-bubble">${text}</div>`;
  chatBody.appendChild(msgDiv);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function showTyping() {
  const chatBody = document.getElementById('chatBody');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg bot'; typingDiv.id = 'typing';
  typingDiv.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatBody.appendChild(typingDiv);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'user');
  showTyping();
  setTimeout(() => {
    removeTyping();
    addMessage(getAnswer(text), 'bot');
  }, 800 + Math.random() * 400);
}

function sendQuick(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

// Welcome message on load
window.addEventListener('load', () => {
  setTimeout(() => {
    addMessage(`Hi ${userName}! 👋 I'm your <strong>DL Assistant</strong>. Ask me anything about the Driving License process — documents, tests, waiting periods, fees, or what to do if you fail!`, 'bot');
  }, 400);
});
</script>
</body>
</html>
